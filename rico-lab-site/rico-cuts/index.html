<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Rico Cuts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">RICO</span>
          <span class="brand-sub">CUTS</span>
        </div>
        <p class="tagline">Drag the record to scratch</p>
      </header>

      <section class="deck" aria-label="Turntable">
        <!-- Platter -->
        <div class="platter" id="platter">
          <div class="record" id="record" role="slider" aria-label="Turntable record" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0" tabindex="0">
            <div class="record-grooves"></div>
            <div class="record-label">
              <span class="label-top">RICO CUTS</span>
              <span class="label-bottom">45 RPM</span>
              <span class="label-dot"></span>
            </div>
            <!-- Marker so rotation is visible -->
            <div class="record-marker"></div>
          </div>
          <!-- Tonearm -->
          <div class="tonearm" id="tonearm">
            <div class="tonearm-base"></div>
            <div class="tonearm-rod"></div>
            <div class="tonearm-head"></div>
          </div>
        </div>
      </section>

      <section class="controls">
        <button class="btn btn-primary" id="playBtn" type="button" aria-pressed="false">
          <span class="btn-icon">▶</span>
          <span class="btn-text">Play</span>
        </button>

        <div class="control-group">
          <label class="control-label" for="volume">Volume</label>
          <input class="slider" id="volume" type="range" min="0" max="100" value="80" />
        </div>

        <div class="control-group">
          <label class="control-label" for="pitch">Base Pitch</label>
          <input class="slider" id="pitch" type="range" min="50" max="150" value="100" />
        </div>

        <div class="track-select">
          <label class="control-label" for="track">Loop</label>
          <select id="track" class="select">
            <option value="funk">Funk Beat</option>
            <option value="boom">Boom Bap</option>
            <option value="tone">Sine Stab</option>
            <option value="stab">Horn Stab</option>
            <option value="bass">808 Groove</option>
            <option value="vox">Vocal Phrase</option>
          </select>
        </div>
      </section>

      <!-- Effects bus -->
      <section class="controls fx-panel" aria-label="Effects">
        <div class="fx-head">
          <span class="control-label">EFFECTS</span>
          <span class="fx-note">rides the whole signal</span>
        </div>
        <div class="fx-grid">
          <div class="fx">
            <label class="control-label" for="fxFilter">Filter</label>
            <input class="slider" id="fxFilter" type="range" min="0" max="100" value="100" />
            <span class="mini-val" id="fxFilterVal">Open</span>
          </div>
          <div class="fx">
            <label class="control-label" for="fxEcho">Echo</label>
            <input class="slider" id="fxEcho" type="range" min="0" max="100" value="0" />
            <span class="mini-val" id="fxEchoVal">0%</span>
          </div>
          <div class="fx">
            <label class="control-label" for="fxDrive">Drive</label>
            <input class="slider" id="fxDrive" type="range" min="0" max="100" value="0" />
            <span class="mini-val" id="fxDriveVal">0%</span>
          </div>
        </div>
      </section>

      <footer class="hud">
        <div class="readout"><span class="readout-key">RATE</span><span class="readout-val" id="rateVal">0.00x</span></div>
        <div class="readout"><span class="readout-key">DIR</span><span class="readout-val" id="dirVal">—</span></div>
        <div class="readout cutout"><span class="readout-key">CUTS</span><span class="readout-val" id="cutsVal">0</span></div>
        <p class="hint">Grab the vinyl and swipe back &amp; forth to scratch. Ride the <strong>Filter</strong>, echo it with
          <strong>Echo</strong>, or add <strong>Drive</strong>. Every direction change counts as a <strong>cut</strong>.</p>
      </footer>
    </main>

    <script src="game.js"></script>
  </body>
</html>
