<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rico's Pocket Sampler</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">RICO'S</span>
          <span class="brand-sub">POCKET</span>
        </div>
        <p class="tagline">sample &middot; chop &middot; sequence</p>
      </header>

      <!-- Source controls -->
      <section class="source" aria-label="Sample source">
        <button id="recBtn" class="btn btn-primary" type="button">
          <span class="dot"></span> Record
        </button>
        <label class="btn btn-ghost" for="fileInput">Load Audio</label>
        <input id="fileInput" type="file" accept="audio/*" hidden />
        <button id="kitBtn" class="btn btn-ghost" type="button">Load Kit</button>
      </section>

      <!-- 8 Pads -->
      <section class="pads" id="pads" aria-label="Sound pads">
        <!-- pads injected by game.js -->
      </section>

      <!-- Waveform editor -->
      <section class="editor" aria-label="Waveform editor">
        <div class="editor-head">
          <span class="editor-title">EDITING <strong id="editTarget">PAD 1</strong></span>
          <div class="editor-actions">
            <button id="playSel" class="chip" type="button">Play</button>
            <button id="chop8" class="chip chip-accent" type="button">Chop &rarr; 8 Pads</button>
          </div>
        </div>
        <div class="wave-wrap">
          <canvas id="wave" class="wave" width="900" height="220"></canvas>
          <div id="handleStart" class="handle handle-start" role="slider" aria-label="Trim start" tabindex="0"></div>
          <div id="handleEnd" class="handle handle-end" role="slider" aria-label="Trim end" tabindex="0"></div>
          <div id="playhead" class="playhead" hidden></div>
        </div>
        <div class="editor-foot">
          <div class="mini">
            <span class="mini-key">START</span>
            <span class="mini-val" id="startVal">0.00s</span>
          </div>
          <div class="mini">
            <span class="mini-key">END</span>
            <span class="mini-val" id="endVal">0.00s</span>
          </div>
          <div class="mini">
            <span class="mini-key">LEN</span>
            <span class="mini-val" id="lenVal">0.00s</span>
          </div>
          <button id="trimBtn" class="chip" type="button">Apply Trim</button>
        </div>
      </section>

      <!-- Sequencer -->
      <section class="sequencer" aria-label="Drum sequencer">
        <div class="seq-head">
          <button id="seqPlay" class="btn btn-primary" type="button">Play Loop</button>
          <div class="seq-ctrl">
            <label class="ctrl-label" for="tempo">BPM</label>
            <input id="tempo" class="slider" type="range" min="60" max="180" value="96" />
            <span class="mini-val" id="tempoVal">96</span>
          </div>
          <button id="clearSeq" class="chip" type="button">Clear</button>
        </div>
        <div class="grid" id="grid" aria-label="Step grid">
          <!-- rows injected by game.js -->
        </div>
      </section>

      <p class="hint">
        Tap a pad to play &amp; select it. Record or load audio, drag the handles to trim,
        then <strong>Chop &rarr; 8 Pads</strong> to slice it across the kit. Program a beat in the grid below.
      </p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
