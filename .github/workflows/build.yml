name: Bash Build and Reload

on:
  push:
    branches: [ main ]

jobs:
  build-and-reload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build Script
        run: |
          chmod +x ./bash.sh
          ./bash.sh

      # This step commits and pushes the updated index.html back to GitHub
      - name: Commit and Reload index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "chore: reload and update index.html [skip ci]"
          git push
