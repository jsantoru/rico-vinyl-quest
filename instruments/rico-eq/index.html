<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0d0a" />
  <title>Rico's EQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" role="application" aria-label="Rico's EQ practice trainer">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#9707;</span>
        <h1>Rico&apos;s EQ</h1>
      </div>
      <button id="powerHint" class="hint" type="button">Tap play to start</button>
    </header>

    <!-- Transport + source -->
    <section class="controls" aria-label="Source and transport">
      <div class="control">
        <label for="sourceSel">Source</label>
        <select id="sourceSel" aria-label="Sound source">
          <option value="pink">Pink Noise</option>
          <option value="white">White Noise</option>
          <option value="drums">Drum Loop</option>
          <option value="tone">Sweep Tone</option>
        </select>
      </div>

      <div class="control">
        <label for="volume">Volume <span id="volVal" class="val">70</span></label>
        <input id="volume" type="range" min="0" max="100" value="70" aria-label="Master volume" />
      </div>

      <div class="control toggles">
        <button id="playBtn" class="toggle" type="button" aria-pressed="false">&#9654; Play</button>
        <button id="bypassBtn" class="toggle" type="button" aria-pressed="false">Bypass EQ</button>
      </div>
    </section>

    <!-- Analyzer + EQ curve -->
    <section class="viz-wrap" aria-label="Frequency display">
      <canvas id="eqCanvas" class="eq-canvas" aria-label="EQ curve and spectrum analyzer"></canvas>
    </section>

    <!-- 5-band parametric EQ -->
    <section class="eq-bands" id="eqBands" aria-label="Parametric EQ bands"></section>

    <!-- Practice / Game -->
    <section class="trainer" aria-label="Ear training game">
      <div class="trainer-head">
        <div class="mode-switch" role="group" aria-label="Practice mode">
          <button id="modeFree" class="mode-btn is-on" type="button" aria-pressed="true">Free Play</button>
          <button id="modeMatch" class="mode-btn" type="button" aria-pressed="false">Match Game</button>
        </div>
        <div id="scoreBox" class="score-box" aria-live="polite">
          <span class="score-label">Score</span>
          <span id="scoreVal" class="score-val">0</span>
        </div>
      </div>

      <div id="gamePanel" class="game-panel" hidden>
        <p id="gameMsg" class="game-msg">A hidden EQ move is applied. Match it with your bands, then check your guess.</p>
        <div class="game-actions">
          <button id="newRoundBtn" class="btn" type="button">New Challenge</button>
          <button id="toggleRefBtn" class="btn ghost" type="button">Hear Target</button>
          <button id="checkBtn" class="btn gold" type="button">Check Match</button>
        </div>
        <div id="resultBar" class="result-bar" aria-live="polite"></div>
      </div>
    </section>

    <footer class="footer">
      <p id="statusLine" aria-live="polite">Ready</p>
      <p class="tip">Drag a band dot on the graph or use the sliders &middot; A/B with Bypass</p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
